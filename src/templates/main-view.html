<!-- main-view.html  (included by index.html) -->
<!-- ═══════════════════════════════════════════════════════
     Main two-panel view
     ═══════════════════════════════════════════════════════ -->
<div class="view active" id="viewMain" style="flex-direction:row;min-height:100vh;width:100%">

  <!-- ── LEFT: FORM PANEL ── -->
  <div class="form-panel">

    <!-- app header -->
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:1rem">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect width="22" height="22" rx="5" fill="#534AB7"/>
        <text x="11" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="monospace">PL</text>
      </svg>
      <span style="font-size:15px;font-weight:600;color:var(--tx)">Oracle PL/SQL Package Creator</span>
      <button class="btn" style="margin-left:auto" onclick="window.PLSQL.showSettings()">⚙ Settings</button>
    </div>

    <!-- package fields -->
    <div class="sec">Package</div>
    <div class="row">
      <div class="col">
        <label>Package name</label>
        <input type="text" id="pkgName" placeholder="e.g. PKG_CUSTOMER_MGMT"/>
      </div>
      <div class="col" style="max-width:120px">
        <label>Schema</label>
        <input type="text" id="pkgSchema" placeholder="e.g. HR"/>
      </div>
      <div class="col" style="max-width:140px">
        <label>Authid</label>
        <select id="pkgAuthid">
          <option value="">— none —</option>
          <option value="DEFINER">DEFINER</option>
          <option value="CURRENT_USER">CURRENT_USER</option>
        </select>
      </div>
    </div>

    <div class="purpose-row">
      <label>Purpose / description</label>
      <input type="text" id="pkgPurpose" placeholder="Brief description of this package"/>
    </div>

    <div class="row" style="gap:16px;margin-bottom:.4rem">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--tx)">
        <input type="checkbox" id="chkOrd"/>
        Oracle standard ordering
        <span class="badge">Types→Cursors→Procs→Funcs</span>
      </label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--tx)">
        <input type="checkbox" id="chkBody" checked/>
        Generate BODY
      </label>
    </div>

    <div class="divider"></div>

    <!-- methods toolbar -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem">
      <div class="sec" style="margin-bottom:0">Methods</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="btn" onclick="window.PLSQL.addM('PROCEDURE')">+ Proc</button>
        <button class="btn" onclick="window.PLSQL.addM('FUNCTION')">+ Func</button>
        <button class="btn" onclick="window.PLSQL.addM('CURSOR')">+ Cursor</button>
        <button class="btn" onclick="window.PLSQL.addM('TYPE_RECORD')">+ Record</button>
        <button class="btn" onclick="window.PLSQL.addM('TYPE_TABLE')">+ Table</button>
        <button class="btn btn-outline-acc" id="btnColExp"
          onclick="window.PLSQL.toggleAllCards()">Collapse all</button>
      </div>
    </div>

    <!-- method cards rendered here -->
    <div id="mlist"></div>

    <button class="add-meth-btn" onclick="window.PLSQL.addM('PROCEDURE')">＋ Add method</button>

    <div class="abar">
      <button class="btn btn-acc" onclick="window.PLSQL.generate()">⚡ Generate package</button>
      <button class="btn" onclick="window.PLSQL.clearAll()">✕ Clear all</button>
    </div>

  </div><!-- /form-panel -->

  <!-- ── RIGHT: OUTPUT PANEL ── -->
  <div class="out-panel">

    <div class="out-head">
      <div class="tabs">
        <div class="tab on" id="tSpec" onclick="window.PLSQL.switchTab('spec')">SPEC</div>
        <div class="tab"    id="tBody" onclick="window.PLSQL.switchTab('body')">BODY</div>
      </div>
      <button class="btn" style="font-size:10px;padding:3px 9px"
        onclick="window.PLSQL.copyCode()">Copy</button>
    </div>

    <div class="ph-msg" id="phMsg">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect width="30" height="30" rx="6" fill="#ede9fe"/>
        <text x="15" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#534AB7" font-family="monospace">PL</text>
      </svg>
      <span>Fill the form and click<br><strong>⚡ Generate package</strong></span>
    </div>

    <div class="codebox" id="cSpec" style="display:none"></div>
    <div class="codebox" id="cBody" style="display:none"></div>

  </div><!-- /out-panel -->

</div>
